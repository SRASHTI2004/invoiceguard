# Render Blueprint. Free plan: no persistent disk, so SQLite is re-created and re-seeded on every start.
services:
  - type: web
    name: invoiceguard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard, never commit
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
